name: Temporary Deploy Thoughtful Start Elevated

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v4

      - name: Restore production archive
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode deploy/thoughtful-start-elevated/site.zip.b64 > thoughtful-start-elevated.zip
          unzip -t thoughtful-start-elevated.zip

      - name: Deploy archive to Netlify
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --form "zip=@thoughtful-start-elevated.zip;type=application/zip" \
            "https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..4uZwDupFMul5S0tF.fRhEybIKQQcNjBu3aN9d6XsiJfUxR9wwT2X4dYJBJc5ebbeHkZ4KhaHoowAZfrQIkSFxa-hkCizBQ_BTUJuyVAO5MFn6SwipgfeP-iT-nYago8FPmWx4ONMdLundagy1aOKb5j4vlrqS8XSJuPs0NzD0YmMuakitssXLuJhDaSk4dzUo2qi1KmKxlABgcK9VxmAcptdunxLO-UZ8sCkMryku0qgt36jMpzrByBekSvXKiHE9TBFjs8qqB6JE-hj8piMNg2tUsKZzRnLSErasJ7ORm5-CztRsbCSmERgdGbet0zzVb5ZEd40RaCJ72dpSootXy1Kce6g1Ot1qs85yGjdTOZY2UFiFlqocuXx7IrxRp8XeD-7n6YJroR8b2kKUDGA4Yi4v.pNVnIXbRwnPqHzvFfzra7w/api/v1/sites/8e07aecf-f8bd-4ead-87d5-f9ef853e2c2e/builds" \
            | tee deploy-response.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('deploy-response.json').read_text())
          if isinstance(payload, list):
              payload = payload[0] if payload else {}
          if not (payload.get('deploy_id') or payload.get('id')):
              raise SystemExit(f'Netlify did not return a deploy identifier: {payload}')
          print('Netlify deploy accepted.')
          PY
