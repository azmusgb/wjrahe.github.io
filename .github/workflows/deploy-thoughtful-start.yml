name: Temporary Deploy Thoughtful Start Final

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore production archive
        shell: bash
        run: |
          set -euo pipefail
          cat <<'B64' | base64 --decode > thoughtful-start.zip
          
          B64
          unzip -t thoughtful-start.zip

      - name: Deploy archive to Netlify
        shell: bash
        run: |
          set -euo pipefail
          PROXY="https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..voSct3Uslzlzlb--.9bbeL_URZbAeCAcMS-bEYmCuJ1aymxBPW1OhPi0joi8Rm4HCiGnPFfrb7WN7xYil2gfQnuU3B88OFwHXImDgcNNJ3M207G31qKT1fd9ZAWm8_KJ3pBoJO_IpFVPjKDC9zmjERQde3KuZj3MlvaDqxZLJHRJWqXSLovXg0Dl0sD08cGMr9NRMt-0OXLY_0Gxerphg4LICDqAfd0PjQ8SucHc7pfvDNzrsw91BiLNYAXjWooGv5Q-_niN6UWVNUEl_WQ5sdXVxS9RxZbOZCpgsW0J5whxkvkSjn6BWPCofAXGXoz9km-AjIm8s5Cri0k5ThWuOd3UIrVWiCXsb8jhhgD45gdEdsy4QsIL3SbuF0OmvirnXXrwNuIM3VR-lqViDXOEdc1BO.5pppKzjDiY3J1ov4YUczhQ"
          SITE_ID="8e07aecf-f8bd-4ead-87d5-f9ef853e2c2e"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --form "zip=@thoughtful-start.zip;type=application/zip" \
            "$PROXY/api/v1/sites/$SITE_ID/builds" \
            | tee deploy-response.json
          DEPLOY_ID=$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('deploy-response.json').read_text())
          if isinstance(payload, list):
              payload = payload[0] if payload else {}
          deploy_id = payload.get('deploy_id') or payload.get('id')
          if not deploy_id:
              raise SystemExit(f'Netlify did not return a deploy identifier: {payload}')
          print(deploy_id)
          PY
          )
          echo "Deploy accepted: $DEPLOY_ID"
          for attempt in $(seq 1 36); do
            curl --fail --silent --show-error "$PROXY/api/v1/deploys/$DEPLOY_ID" > deploy-status.json
            STATE=$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('deploy-status.json').read_text()).get('state','unknown'))
          PY
            )
            echo "Deploy state: $STATE"
            if [ "$STATE" = "ready" ]; then exit 0; fi
            if [ "$STATE" = "error" ]; then cat deploy-status.json; exit 1; fi
            sleep 5
          done
          echo "Timed out waiting for Netlify deploy" >&2
          exit 1
